<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do list</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="todo-app">
            <h1>To-do app</h1>
            <form class="input-area" >
                <input type="text" id="task-input" placeholder="I'll do...">
                <button id="add-task-btn" type="button" value="Add">Add</button>
            </form>
            <div class="task-container">
                <ul id="task-list"></ul>
                <img class="empty-image" src="empty-todo.png" alt="empty">
            </div>
        </div>
    </div>
</body>
<script src="script.js"> </script>
</html>
